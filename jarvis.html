<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.JARVIS — Personal Console</title>
<style>
  :root{
    --bg: #0A0C10;
    --panel: #12151C;
    --panel-2: #171B24;
    --line: #262B36;
    --gold: #D4A24C;
    --gold-dim: #8A6E38;
    --teal: #4C7A8A;
    --text: #E8E6DF;
    --muted: #7A8290;
    --danger: #C2542E;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #1a1f2b 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    width:100%;
    max-width:560px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }

  /* ---------- Top corner controls ---------- */
  .topbar{
    position:absolute;
    top:0; right:0;
    display:flex;
    gap:8px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    z-index:5;
  }
  .corner-btn{
    position:relative;
    width:34px; height:34px;
    border-radius:9px;
    border:1px solid var(--line);
    background:rgba(18,21,28,0.65);
    backdrop-filter:blur(6px);
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .corner-btn svg{ width:16px; height:16px; }
  .corner-btn.lang{ font-family:var(--mono); font-size:10.5px; }
  .corner-btn:active{ background:rgba(23,27,36,0.9); }
  .corner-btn.has-new::after{
    content:''; position:absolute; top:5px; right:5px;
    width:6px; height:6px; border-radius:50%; background:var(--gold);
  }

  /* ---------- Orb (full-screen, no labels) ---------- */
  .orb-stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #orbCanvas{ display:block; }

  /* ---------- Input bar ---------- */
  .inputbar{
    border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    align-items:flex-end;
    gap:8px;
    flex-shrink:0;
    background:var(--bg);
  }
  .inputbar textarea{
    flex:1;
    resize:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14.5px;
    padding:10px 12px;
    max-height:110px;
    line-height:1.4;
  }
  .inputbar textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .icon-btn{
    width:42px; height:42px; border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{ background:var(--panel-2); }
  .icon-btn.mic.active{
    background:#2A1810; border-color:var(--danger); color:var(--danger);
    animation: micpulse 1.2s ease-in-out infinite;
  }
  @keyframes micpulse{ 50%{ box-shadow:0 0 0 6px rgba(194,84,46,0.12);} }
  .icon-btn.send{ background:var(--gold-dim); border-color:var(--gold-dim); color:#111; }
  .icon-btn svg{ width:19px; height:19px; }

  /* ---------- Drawers (chat history / devices), hidden until opened ---------- */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s;
    z-index:15;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }
  .drawer{
    position:absolute;
    left:0; right:0; bottom:0;
    max-height:68vh;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
    transition:transform 0.28s ease;
    z-index:20;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .drawer.open{ transform:translateY(0); }
  .drawer-handle{ width:36px; height:4px; background:var(--line); border-radius:2px; margin:10px auto 4px; flex-shrink:0; }
  .drawer-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 18px 10px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em;
    color:var(--muted); text-transform:uppercase;
    flex-shrink:0;
  }
  .drawer-close{ background:none; border:none; color:var(--muted); font-size:16px; line-height:1; cursor:pointer; padding:4px; }

  /* ---------- Chat (inside drawer) ---------- */
  .chat{
    overflow-y:auto;
    padding:4px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.8;
    padding:20px 10px;
  }
  .msg{
    max-width:88%;
    padding:11px 14px;
    border-radius:3px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-right:2px solid var(--gold-dim);
  }
  .msg.assistant{
    align-self:flex-start;
    background:transparent;
    border-left:2px solid var(--gold);
    padding-left:13px;
  }
  .msg.assistant .label, .msg.user .label{
    display:block;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.14em;
    color:var(--muted);
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .msg.thinking-msg{
    align-self:flex-start;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    padding-left:13px;
    border-left:2px solid var(--line);
  }

  /* ---------- Devices (inside drawer) ---------- */
  .devices-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0 18px 12px;
    overflow-y:auto;
  }
  .device{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .device .dname{ font-size:12.5px; }
  .device .dsub{ font-family:var(--mono); font-size:9.5px; color:var(--muted); margin-top:2px; }
  .switch{
    width:34px; height:19px; border-radius:10px;
    background:var(--line);
    position:relative; flex-shrink:0; cursor:pointer;
    border:none;
  }
  .switch.on{ background:var(--gold-dim); }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px;
    width:15px; height:15px; border-radius:50%;
    background:var(--muted);
    transition:transform 0.15s, background 0.15s;
  }
  .switch.on::after{ transform:translateX(15px); background:var(--gold); }
  .devices-note{
    padding:0 18px 16px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--muted);
    line-height:1.6;
    flex-shrink:0;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="corner-btn" id="historyBtn" title="บทสนทนา">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="corner-btn" id="devicesBtn" title="อุปกรณ์">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
    </button>
    <button class="corner-btn lang" id="langToggle">TH</button>
  </div>

  <div class="orb-stage" id="orbStage">
    <canvas id="orbCanvas"></canvas>
  </div>

  <div class="inputbar">
    <button class="icon-btn mic" id="micBtn" title="พูด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <textarea id="textInput" rows="1" placeholder="พิมพ์ข้อความ หรือกดไมค์เพื่อพูด..."></textarea>
    <button class="icon-btn send" id="sendBtn" title="ส่ง">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="drawer" id="chatDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">บทสนทนา <button class="drawer-close" id="closeChatBtn">✕</button></div>
    <div class="chat" id="chat">
      <div class="empty-state" id="emptyState">ยังไม่มีบทสนทนา — แตะไมค์แล้วลองพูดกับ Jarvis ดูครับ</div>
    </div>
  </div>

  <div class="drawer" id="devicesDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">อุปกรณ์ในบ้าน (Demo) <button class="drawer-close" id="closeDevicesBtn">✕</button></div>
    <div class="devices-grid" id="devicesGrid"></div>
    <div class="devices-note">หมายเหตุ: ปุ่มนี้เป็นตัวจำลองเพื่อสาธิตการควบคุมด้วยเสียง ("เปิดไฟห้องนั่งเล่น") การควบคุมอุปกรณ์จริงต้องเชื่อมกับฮับ เช่น Home Assistant / Tuya เพิ่มเติม</div>
  </div>

</div>

<script>
(function(){
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const textInput = document.getElementById('textInput');
  const langToggle = document.getElementById('langToggle');
  const devicesGrid = document.getElementById('devicesGrid');
  const historyBtn = document.getElementById('historyBtn');
  const devicesBtn = document.getElementById('devicesBtn');
  const chatDrawer = document.getElementById('chatDrawer');
  const devicesDrawer = document.getElementById('devicesDrawer');
  const backdrop = document.getElementById('backdrop');
  const closeChatBtn = document.getElementById('closeChatBtn');
  const closeDevicesBtn = document.getElementById('closeDevicesBtn');
  const orbStage = document.getElementById('orbStage');

  // ---------- Drawers ----------
  function openDrawer(drawer){
    chatDrawer.classList.remove('open');
    devicesDrawer.classList.remove('open');
    drawer.classList.add('open');
    backdrop.classList.add('show');
    if(drawer === chatDrawer) historyBtn.classList.remove('has-new');
  }
  function closeDrawers(){
    chatDrawer.classList.remove('open');
    devicesDrawer.classList.remove('open');
    backdrop.classList.remove('show');
  }
  historyBtn.addEventListener('click', ()=> openDrawer(chatDrawer));
  devicesBtn.addEventListener('click', ()=> openDrawer(devicesDrawer));
  closeChatBtn.addEventListener('click', closeDrawers);
  closeDevicesBtn.addEventListener('click', closeDrawers);
  backdrop.addEventListener('click', closeDrawers);

  // ---------- Orb (Siri-style reactive blob, fills available screen space) ----------
  const orbCanvas = document.getElementById('orbCanvas');
  const octx = orbCanvas.getContext('2d');
  let OCW, OCH, OCX, OCY, ORB_BASE_R, ORB_NOISE_AMP, ORB_LEVEL_AMP;
  let currentState = 'idle'; // idle | listening | thinking | speaking
  let micLevel = 0;
  let speakPulse = 0;
  let orbTime = 0;

  function resizeOrbCanvas(){
    const cssSize = Math.max(180, Math.min(orbStage.clientWidth, orbStage.clientHeight) * 0.7);
    const dpr = window.devicePixelRatio || 1;
    orbCanvas.style.width = cssSize + 'px';
    orbCanvas.style.height = cssSize + 'px';
    orbCanvas.width = Math.round(cssSize * dpr);
    orbCanvas.height = Math.round(cssSize * dpr);
    OCW = orbCanvas.width; OCH = orbCanvas.height;
    OCX = OCW / 2; OCY = OCH / 2;
    ORB_BASE_R = OCW * 0.27;
    ORB_NOISE_AMP = OCW * 0.022;
    ORB_LEVEL_AMP = OCW * 0.19;
  }
  resizeOrbCanvas();
  window.addEventListener('resize', resizeOrbCanvas);
  window.addEventListener('orientationchange', resizeOrbCanvas);

  const ORB_COLORS = {
    idle:      { inner:'#E8C579', outer:'#5C4A28', glow:'rgba(212,162,76,0.45)' },
    listening: { inner:'#8FD0E0', outer:'#284450', glow:'rgba(95,168,194,0.5)' },
    thinking:  { inner:'#F2CE84', outer:'#5C4A28', glow:'rgba(212,162,76,0.55)' },
    speaking:  { inner:'#A6E0B2', outer:'#2F5236', glow:'rgba(127,184,138,0.5)' }
  };

  function orbLevel(){
    if(currentState === 'listening') return micLevel;
    if(currentState === 'speaking'){ const l = speakPulse; speakPulse *= 0.88; return l; }
    if(currentState === 'thinking') return (Math.sin(orbTime*6)+1)/2 * 0.55;
    return (Math.sin(orbTime*1.1)+1)/2 * 0.14; // idle breathing
  }

  function drawOrb(){
    orbTime += 0.02;
    octx.clearRect(0,0,OCW,OCH);
    const level = orbLevel();
    const colors = ORB_COLORS[currentState] || ORB_COLORS.idle;
    const points = 9;
    const pts = [];
    for(let i=0;i<points;i++){
      const angle = (i/points) * Math.PI*2;
      const noise = Math.sin(orbTime*1.8 + i*1.9) * ORB_NOISE_AMP;
      const r = ORB_BASE_R + noise + level*ORB_LEVEL_AMP;
      pts.push({ x: OCX + Math.cos(angle)*r, y: OCY + Math.sin(angle)*r });
    }
    octx.beginPath();
    const last = pts[pts.length-1], first = pts[0];
    let mid = {x:(last.x+first.x)/2, y:(last.y+first.y)/2};
    octx.moveTo(mid.x, mid.y);
    for(let i=0;i<pts.length;i++){
      const p1 = pts[i];
      const p2 = pts[(i+1)%pts.length];
      const m = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
      octx.quadraticCurveTo(p1.x, p1.y, m.x, m.y);
    }
    octx.closePath();
    const grad = octx.createRadialGradient(OCX, OCY, OCW*0.02, OCX, OCY, ORB_BASE_R + ORB_LEVEL_AMP*1.15);
    grad.addColorStop(0, colors.inner);
    grad.addColorStop(1, colors.outer);
    octx.fillStyle = grad;
    octx.shadowColor = colors.glow;
    octx.shadowBlur = OCW * 0.12;
    octx.fill();
    octx.shadowBlur = 0;

    requestAnimationFrame(drawOrb);
  }
  requestAnimationFrame(drawOrb);

  // ---------- Mic audio analyser (drives orb while listening) ----------
  let audioCtx = null, analyser = null, micStream = null, micData = null;
  async function startMicAnalyser(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') await audioCtx.resume();
      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      micData = new Uint8Array(analyser.frequencyBinCount);
      pollMicLevel();
    }catch(e){ console.error('mic analyser unavailable', e); }
  }
  function pollMicLevel(){
    if(!analyser || currentState !== 'listening') return;
    analyser.getByteTimeDomainData(micData);
    let sum = 0;
    for(let i=0;i<micData.length;i++){ const v=(micData[i]-128)/128; sum += v*v; }
    micLevel = Math.min(1, Math.sqrt(sum/micData.length) * 4.5);
    requestAnimationFrame(pollMicLevel);
  }
  function stopMicAnalyser(){
    micLevel = 0;
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
    analyser = null;
  }

  let lang = 'th-TH'; // 'th-TH' or 'en-US'
  let history = []; // {role, content}
  let devices = [
    {id:'living_light', name:'ไฟห้องนั่งเล่น', sub:'LIVING LIGHT', on:false},
    {id:'ac', name:'แอร์', sub:'AIR CON', on:false},
    {id:'door_lock', name:'ล็อคประตู', sub:'DOOR LOCK', on:true},
    {id:'kitchen_light', name:'ไฟห้องครัว', sub:'KITCHEN LIGHT', on:false},
  ];

  const HISTORY_KEY = 'jarvis:history';
  const DEVICES_KEY = 'jarvis:devices';

  // ---------- Storage ----------
  async function loadState(){
    try{
      const h = await window.storage.get(HISTORY_KEY);
      if(h && h.value) history = JSON.parse(h.value);
    }catch(e){ history = []; }
    try{
      const d = await window.storage.get(DEVICES_KEY);
      if(d && d.value) devices = JSON.parse(d.value);
    }catch(e){ /* keep defaults */ }

    renderHistory();
    renderDevices();
  }
  async function saveHistory(){
    try{ await window.storage.set(HISTORY_KEY, JSON.stringify(history.slice(-60))); }
    catch(e){ console.error('save history failed', e); }
  }
  async function saveDevices(){
    try{ await window.storage.set(DEVICES_KEY, JSON.stringify(devices)); }
    catch(e){ console.error('save devices failed', e); }
  }

  // ---------- Rendering ----------
  function renderHistory(){
    chat.querySelectorAll('.msg').forEach(el=>el.remove());
    if(history.length === 0){
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      history.forEach(m=>appendMsg(m.role, m.content, false));
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function appendMsg(role, text, scroll=true){
    emptyState.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = role === 'user' ? 'คุณ' : 'JARVIS';
    div.appendChild(label);
    const body = document.createElement('span');
    body.textContent = text;
    div.appendChild(body);
    chat.appendChild(div);
    if(scroll) chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function renderDevices(){
    devicesGrid.innerHTML = '';
    devices.forEach(dev=>{
      const card = document.createElement('div');
      card.className = 'device';
      card.innerHTML = `
        <div>
          <div class="dname">${dev.name}</div>
          <div class="dsub">${dev.sub}</div>
        </div>
        <button class="switch ${dev.on ? 'on':''}" data-id="${dev.id}"></button>
      `;
      devicesGrid.appendChild(card);
    });
    devicesGrid.querySelectorAll('.switch').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');
        const dev = devices.find(d=>d.id===id);
        dev.on = !dev.on;
        renderDevices();
        saveDevices();
      });
    });
  }

  function setCoreState(state){ // idle | listening | thinking | speaking
    currentState = state;
    if(state === 'listening'){ startMicAnalyser(); }
    else{ stopMicAnalyser(); }
  }

  function findDeviceCommand(text){
    const t = text.toLowerCase();
    const wantsOn = /(เปิด|turn on|switch on)/.test(t);
    const wantsOff = /(ปิด|turn off|switch off)/.test(t);
    if(!wantsOn && !wantsOff) return null;
    for(const dev of devices){
      if(t.includes(dev.name.toLowerCase()) || t.includes(dev.sub.toLowerCase())){
        return { dev, on: wantsOn };
      }
    }
    return null;
  }

  // ---------- Claude API call ----------
  async function askJarvis(userText){
    // local device-control shortcut, handled without API call
    const cmd = findDeviceCommand(userText);
    if(cmd){
      cmd.dev.on = cmd.on;
      renderDevices();
      saveDevices();
      return `${cmd.on ? 'เปิด' : 'ปิด'}${cmd.dev.name}เรียบร้อยครับ`;
    }

    const systemPrompt = `You are JARVIS, a concise, capable personal voice assistant speaking with a user based in Bangkok who actively trades XAU/USD (gold) forex and is learning technical analysis (CRT, TBS, "Mae Pla" system). Respond primarily in Thai unless the user writes in English. Keep spoken-style answers short and natural (2-5 sentences) since responses may be read aloud via text-to-speech — avoid heavy markdown, bullet lists, or long tables. Use the web_search tool whenever the user asks about the current gold price, market news, or anything time-sensitive. Be direct and warm, like a sharp personal assistant, not a generic chatbot.`;

    const apiMessages = history
      .slice(-16)
      .map(m => ({ role: m.role, content: m.content }))
      .concat([{ role: 'user', content: userText }]);

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: apiMessages,
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });

    if(!response.ok){
      throw new Error('API error ' + response.status);
    }
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const finalText = textBlocks.join('\n').trim();
    return finalText || 'ขออภัยครับ ไม่สามารถประมวลผลคำตอบได้ในขณะนี้';
  }

  // ---------- Speak ----------
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const hasThai = /[\u0E00-\u0E7F]/.test(text);
    utter.lang = hasThai ? 'th-TH' : 'en-US';
    utter.rate = 1.02;

    let pulseTimer = null;
    utter.onstart = ()=>{
      setCoreState('speaking');
      // rhythmic pulses so the orb moves with the cadence of speech,
      // topped up by word-boundary events where the browser supports them
      pulseTimer = setInterval(()=>{ speakPulse = 0.45 + Math.random()*0.55; }, 170);
    };
    utter.onboundary = ()=>{ speakPulse = 1; };
    utter.onend = ()=>{ clearInterval(pulseTimer); speakPulse = 0; setCoreState('idle'); };
    utter.onerror = ()=>{ clearInterval(pulseTimer); speakPulse = 0; setCoreState('idle'); };
    window.speechSynthesis.speak(utter);
  }

  // ---------- Send flow ----------
  async function sendMessage(text){
    text = text.trim();
    if(!text) return;
    textInput.value = '';
    textInput.style.height = 'auto';

    appendMsg('user', text);
    history.push({role:'user', content:text});
    saveHistory();

    setCoreState('thinking');
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg thinking-msg';
    thinkingEl.textContent = 'กำลังคิด...';
    chat.appendChild(thinkingEl);
    chat.scrollTop = chat.scrollHeight;

    try{
      const reply = await askJarvis(text);
      thinkingEl.remove();
      appendMsg('assistant', reply);
      history.push({role:'assistant', content: reply});
      saveHistory();
      speak(reply);
      if(!chatDrawer.classList.contains('open')) historyBtn.classList.add('has-new');
    }catch(err){
      thinkingEl.remove();
      const errText = 'ขออภัยครับ เกิดข้อผิดพลาดในการเชื่อมต่อ (' + err.message + ')';
      appendMsg('assistant', errText);
      setCoreState('idle');
    }
  }

  sendBtn.addEventListener('click', ()=> sendMessage(textInput.value));
  textInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(textInput.value);
    }
  });
  textInput.addEventListener('input', ()=>{
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
  });

  // ---------- Speech recognition ----------
  let recognition = null;
  let listening = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setupRecognition(){
    if(!SR){
      micBtn.style.opacity = '0.35';
      micBtn.title = 'เบราว์เซอร์นี้ไม่รองรับการพูด (ลองใช้ Chrome)';
      return;
    }
    recognition = new SR();
    recognition.lang = lang;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = ()=>{
      listening = true;
      micBtn.classList.add('active');
      setCoreState('listening');
    };
    recognition.onend = ()=>{
      listening = false;
      micBtn.classList.remove('active');
      if(currentState === 'listening') setCoreState('idle');
    };
    recognition.onerror = ()=>{
      listening = false;
      micBtn.classList.remove('active');
      setCoreState('idle');
    };
    recognition.onresult = (event)=>{
      const transcript = event.results[0][0].transcript;
      sendMessage(transcript);
    };
  }
  setupRecognition();

  micBtn.addEventListener('click', ()=>{
    if(!recognition) return;
    if(listening){
      recognition.stop();
    } else {
      recognition.lang = lang;
      try{ recognition.start(); }catch(e){ /* already started */ }
    }
  });

  langToggle.addEventListener('click', ()=>{
    lang = (lang === 'th-TH') ? 'en-US' : 'th-TH';
    langToggle.textContent = (lang === 'th-TH') ? 'TH' : 'EN';
  });

  loadState();
})();
</script>
</body>
</html>
